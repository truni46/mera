<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 120"
  width="100%"
  height="100%"
>
  <defs>
    <linearGradient id="premiumSpinnerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99f6e4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#007E6E" />
    </linearGradient>
  </defs>

  <circle
    cx="60"
    cy="60"
    r="42"
    fill="none"
    stroke="#e5e7eb"
    stroke-width="10"
    opacity="0.5"
  />

  <circle
    cx="60"
    cy="60"
    r="42"
    fill="none"
    stroke="url(#premiumSpinnerGradient)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="70 194"
  >
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 60 60"
      to="360 60 60"
      dur="1s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="stroke-dasharray"
      values="70 194;100 164;70 194"
      dur="1.4s"
      repeatCount="indefinite"
    />
  </circle>
</svg>