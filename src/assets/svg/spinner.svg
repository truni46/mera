<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 120"
  width="100%"
  height="100%"
>
  <circle
    cx="60"
    cy="60"
    r="42"
    fill="none"
    stroke="#d1e8e4"
    stroke-width="10"
    opacity="0.6"
  />

  <circle
    cx="60"
    cy="60"
    r="42"
    fill="none"
    stroke="#007E6E"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="84 180"
  >
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 60 60"
      to="360 60 60"
      dur="0.9s"
      repeatCount="indefinite"
    />
  </circle>
</svg>